<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLW Call Ringer Prototype</title>
    <link rel="stylesheet" href="call-ringer.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FLW Call Ringer Prototype</h1>
            <div class="identity">
                <span id="current-user">Loading...</span>
            </div>
        </header>

        <main>
            <section class="user-list-section">
                <h2>Online Users</h2>
                <ul id="user-list" class="user-list">
                    <!-- Populated by JavaScript -->
                </ul>
            </section>

            <section class="call-status-section">
                <div id="call-status" class="call-status idle">
                    <span id="status-text">Ready</span>
                </div>
            </section>

            <section class="incoming-call-section" id="incoming-call-section" style="display: none;">
                <div class="incoming-call-modal">
                    <h3>Incoming Call</h3>
                    <p class="caller-name" id="caller-name-display"></p>
                    <div class="call-actions">
                        <button id="accept-btn" class="btn btn-accept">Accept</button>
                        <button id="decline-btn" class="btn btn-decline">Decline</button>
                    </div>
                </div>
            </section>

            <section class="event-log-section">
                <h2>Event Log</h2>
                <div id="event-log" class="event-log">
                    <!-- Events will be appended here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Audio element for ring sound -->
    <audio id="ring-sound" loop>
        <!-- We'll generate a simple tone using Web Audio API instead -->
    </audio>

    <script src="call-ringer.js"></script>
</body>
</html>
